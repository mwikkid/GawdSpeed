#
# Release on a version tag (spec §7.7, §10b): push `v0.2.0` and this builds
# the DMG from that tag, signs and notarizes it when the signing secrets are
# set, and publishes a GitHub Release with the DMG plus the corresponding
# source (this repo at the tag, ffmpeg and LAME sources, the build script).
#
# Repository secrets (Settings > Secrets and variables > Actions); none are
# required, but without them the release is UNSIGNED:
#   DEVELOPER_ID_P12_BASE64   Developer ID Application certificate + key (.p12), base64
#   DEVELOPER_ID_P12_PASSWORD its password
#   DEVELOPER_ID_APPLICATION  the identity name, "Developer ID Application: Name (TEAMID)"
#   NOTARY_KEY_P8_BASE64      App Store Connect API key (.p8), base64
#   NOTARY_KEY_ID, NOTARY_ISSUER_ID

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache ffmpeg sources
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-src
          key: ffmpeg-src-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Set up signing (only if the secrets exist)
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_P8: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          if [ -z "$P12" ] || [ -z "$IDENTITY" ]; then
            echo "No signing secrets: this release will be UNSIGNED."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/id.p12"
          echo "DEVELOPER_ID_APPLICATION=$IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$NOTARY_P8" ]; then
            echo "$NOTARY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            xcrun notarytool store-credentials gawdspeed-notary --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$KEYCHAIN"
            rm "$RUNNER_TEMP/notary.p8"
            echo "NOTARY_PROFILE=gawdspeed-notary" >> "$GITHUB_ENV"
          fi

      - name: Build release
        run: scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "GawdSpeed ${GITHUB_REF_NAME#v}" --notes \
          "Built from tag [$GITHUB_REF_NAME](https://github.com/${{ github.repository }}/tree/$GITHUB_REF_NAME), which is this release's corresponding source.

          GawdSpeed is free software under the GNU GPL v3 or later. The DMG includes the license and third-party notices. Also attached: the source at this tag, and the exact FFmpeg and LAME sources plus the script that built the bundled ffmpeg."
